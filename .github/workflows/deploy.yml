name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Prepare Public Production Site (Strictly Exclude Admin & Secrets)
        run: |
          mkdir -p _site
          # Copy only public client-facing assets
          cp index.html _site/
          cp style.css _site/
          cp script.js _site/
          cp portfolio-data.json _site/
          cp resume.pdf _site/
          cp resume.html _site/
          cp LICENSE _site/
          
          # Copy profile picture / assets directory if present
          if [ -f "profile.jpg" ]; then cp profile.jpg _site/; fi
          if [ -d "assets" ]; then cp -r assets _site/; fi
          
          # CRITICAL SECURITY BARRIER: Ensure admin.html and server.js are NEVER published to GitHub Pages
          rm -f _site/admin.html _site/server.js
          echo "Public artifact prepared. admin.html and server.js are strictly excluded."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
